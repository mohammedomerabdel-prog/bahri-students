<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الطلاب - جامعة بحري</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #28a745;
      --dark-color: #333;
      --light-bg: #f8f9fa;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--light-bg);
      color: var(--dark-color);
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }
    nav {
      background: #004085;
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 4px;
    }
    nav a:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .admin-btn {
      position: absolute;
      left: 15px;
      top: 15px;
      background: #ffc107;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .section-title {
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 5px;
      margin-top: 30px;
      color: var(--primary-color);
    }
    .course-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .lecture-box {
      background: #e9ecef;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-link {
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
    }
    /* نافذة المشرفين Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
    }
    .modal-content label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-submit {
      background: var(--secondary-color);
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      margin-top: 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-cancel {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px;
      width: 100%;
      margin-top: 5px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>منصة المواد الدراسية</h1>
    <button class="admin-btn" onclick="openAdminModal()">⚙️ لوحة المشرفين</button>
  </header>

  <nav>
    <a href="#courses-section">المواد الدراسية</a>
    <a href="#bank-section">بنك الأسئلة</a>
  </nav>

  <div class="container">
    
    <!-- قسم المواد الدراسية -->
    <h2 id="courses-section" class="section-title">📚 المواد الدراسية (المحاضرات)</h2>
    
    <div class="course-card">
      <h3>الرياضيات المالية (Business Mathematics)</h3>
      <div id="courses-math-list">
        <!-- المحاضرات المضافة ستظهر هنا -->
      </div>
    </div>

    <div class="course-card">
      <h3>الإحصاء (Statistics)</h3>
      <div id="courses-stats-list">
        <!-- المحاضرات المضافة ستظهر هنا -->
      </div>
    </div>

    <div class="course-card">
      <h3>الحاسوب (Computer Science)</h3>
      <div id="courses-computer-list">
        <!-- المحاضرات المضافة ستظهر هنا -->
      </div>
    </div>

    <!-- قسم بنك الأسئلة -->
    <h2 id="bank-section" class="section-title">📝 بنك الأسئلة والأمتحانات</h2>
    
    <div class="course-card">
      <h3>أسئلة الرياضيات المالية</h3>
      <div id="bank-math-list">
        <!-- نماذج الامتحانات ستظهر هنا -->
      </div>
    </div>

    <div class="course-card">
      <h3>أسئلة الإحصاء</h3>
      <div id="bank-stats-list">
        <!-- نماذج الامتحانات ستظهر هنا -->
      </div>
    </div>

    <div class="course-card">
      <h3>أسئلة الحاسوب</h3>
      <div id="bank-computer-list">
        <!-- نماذج الامتحانات ستظهر هنا -->
      </div>
    </div>

  </div>

  <!-- النافذة المنبثقة للوحة المشرفين -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>إضافة محتوى جديد 🚀</h3>
      
      <label>كلمة السر:</label>
      <input type="password" id="adminPass" placeholder="أدخل كلمة السر">

      <div id="adminForm" style="display:none; margin-top:10px;">
        <label>إضافة إلى:</label>
        <select id="sectionType" onchange="updateLabel()">
          <option value="courses">المواد الدراسية (المحاضرات)</option>
          <option value="bank">بنك الأسئلة والامتحانات</option>
        </select>

        <label>اختر المادة:</label>
        <select id="courseSelect">
          <option value="math">الرياضيات المالية</option>
          <option value="stats">الإحصاء</option>
          <option value="computer">الحاسوب</option>
        </select>

        <label id="numberLabel">رقم المحاضرة:</label>
        <input type="number" id="itemNumber" placeholder="مثلاً: 5" min="1">

        <label>عنوان المحاضرة / الشيت:</label>
        <input type="text" id="itemTitle" placeholder="مثلاً: نظرية المجموعات">

        <label>رابط الملف (رابط تلغرام أو pdf/):</label>
        <input type="text" id="itemLink" placeholder="مثال: https://t.me/channel/105 أو pdf/math5.pdf">

        <button onclick="addNewContent()" class="btn-submit">نشر التوجيه فوراً</button>
      </div>

      <button onclick="checkPassword()" id="loginBtn" class="btn-submit" style="background:var(--primary-color);">دخول</button>
      <button onclick="closeAdminModal()" class="btn-cancel">إلغاء</button>
    </div>
  </div>

  <script>
    const SECRET_KEY = "1234"; // كلمة السر الخاصة بالمشرفين

    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
      document.getElementById('adminForm').style.display = 'none';
      document.getElementById('loginBtn').style.display = 'block';
      document.getElementById('adminPass').value = '';
    }

    function checkPassword() {
      const pass = document.getElementById('adminPass').value;
      if (pass === SECRET_KEY) {
        document.getElementById('adminForm').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
      } else {
        alert("كلمة السر غير صحيحة!");
      }
    }

    function updateLabel() {
      const section = document.getElementById('sectionType').value;
      document.getElementById('numberLabel').innerText = section === 'courses' ? 'رقم المحاضرة:' : 'رقم الشيت / الامتحان:';
    }

    function addNewContent() {
      const section = document.getElementById('sectionType').value;
      const course = document.getElementById('courseSelect').value;
      const number = document.getElementById('itemNumber').value;
      const title = document.getElementById('itemTitle').value;
      const link = document.getElementById('itemLink').value;

      if (!number || !title || !link) {
        alert("يرجى ملء كافة البيانات!");
        return;
      }

      // تحديد اسم الخانة حسب النوع
      const labelText = section === 'courses' ? `المحاضرة (${number})` : `نموذج/شيت (${number})`;

      // بناء العنصر المضاف
      const newItem = document.createElement('div');
      newItem.className = 'lecture-box';
      newItem.innerHTML = `
        <span><strong>${labelText}:</strong> ${title}</span>
        <a href="${link}" target="_blank" class="btn-link">📄 فتح المحتوى</a>
      `;

      // التوجيه التلقائي للمكان المطلوب
      const targetId = `${section}-${course}-list`;
      const targetContainer = document.getElementById(targetId);

      if (targetContainer) {
        targetContainer.appendChild(newItem);
        alert("تم التوجيه والإضافة بنجاح! 🎉");
        closeAdminModal();
      } else {
        alert("حدث خطأ في تحديد المكان!");
      }
    }
  </script>
</body>
</html>
